apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-ingress
  namespace: event-pipeline
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "server"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "event-pipeline/server-backend-ca"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - server
    - server.example.com
    - server.local
    secretName: server-tls-secret
  rules:
  - host: server
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server
            port:
              number: 5001
  - host: server.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server
            port:
              number: 5001
  - host: server.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server
            port:
              number: 5001